<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | CardioRisk AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<nav class="nav"><div class="brand">❤️ CardioRisk AI</div><div class="nav-links"><a href="login.html">Sign In</a><a class="active" href="register.html">Register</a></div></nav>
<div id="toast" class="toast"></div>
<main class="wrap"><section class="card" style="max-width:520px;margin:50px auto"><h1>Create Your Account</h1><p>Register to use CardioRisk AI.</p>
<div class="form-group"><label>Full Name</label><input id="name" placeholder="Enter full name"></div>
<div class="form-group"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
<div class="form-group"><label>Phone</label><input id="phone" placeholder="Phone number"></div>
<div class="form-group"><label>Password</label><input id="password" type="password" minlength="6" placeholder="Minimum 6 characters"></div>
<button class="btn" onclick="register()">Create Account</button>
<p style="margin-top:18px">Already have an account? <a href="login.html">Sign in</a></p></section></main>
<script src="app.js"></script>
</body></html>
